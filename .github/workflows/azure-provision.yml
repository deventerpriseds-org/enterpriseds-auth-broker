name: Provision Auth Broker (Static Web App)
# Run once to create the enterpriseds-auth-broker Static Web App. Idempotent.

on:
  workflow_dispatch:

env:
  RESOURCE_GROUP: EnterpriseDS_ResourceGRP
  STATIC_WEB_APP: enterpriseds-auth-broker
  SWA_LOCATION: eastus2   # Static Web Apps are only offered in a few regions

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Create Static Web App (if missing)
        run: |
          if az staticwebapp show --name "$STATIC_WEB_APP" --resource-group "$RESOURCE_GROUP" &>/dev/null; then
            echo "Static Web App $STATIC_WEB_APP already exists — skipping."
          else
            az staticwebapp create --name "$STATIC_WEB_APP" --resource-group "$RESOURCE_GROUP" --location "$SWA_LOCATION"
          fi

      - name: Report hostname (register THIS in Google as the redirect URI)
        run: |
          HOST=$(az staticwebapp show --name "$STATIC_WEB_APP" --resource-group "$RESOURCE_GROUP" --query "defaultHostname" -o tsv)
          echo "Broker hostname: https://$HOST"
          echo "### Auth broker ready" >> "$GITHUB_STEP_SUMMARY"
          echo "Register this as the Google OAuth **Authorized redirect URI**: \`https://$HOST\`" >> "$GITHUB_STEP_SUMMARY"
