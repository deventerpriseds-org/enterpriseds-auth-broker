<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>EnterpriseDS Auth Broker</title>
  </head>
  <body style="font-family: sans-serif; padding: 24px; color: #444;">
    <p id="msg">Completing sign-in…</p>
    <script>
      // Central OAuth redirect broker.
      // Google redirects here with ?code&state; `state` carries the originating
      // app's origin (base64url JSON: {p:"google", o:"https://<app>"}). We forward
      // the auth code back to that app, which exchanges it via its own API.
      (function () {
        var msg = document.getElementById("msg");
        function fail(t) { msg.textContent = t; }

        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var error = params.get("error");
        var stateRaw = params.get("state");

        if (!stateRaw) return fail("Missing state — cannot route this sign-in.");

        var state;
        try {
          state = JSON.parse(atob(stateRaw.replace(/-/g, "+").replace(/_/g, "/")));
        } catch (e) {
          return fail("Invalid state.");
        }
        if (!state || !state.o) return fail("No origin in state.");

        // Defense-in-depth: only forward to EnterpriseDS-hosted origins, so a forged
        // `state` can't turn this into an open redirect / code stealer.
        //
        // Two platforms, two branches, deliberately NOT merged into one looser pattern:
        //   - Static Web Apps   <name>.<digits>.azurestaticapps.net      (unchanged)
        //   - Container Apps    <app>.<unique>.<region>.azurecontainerapps.io
        // The SWA branch is byte-identical to what shipped before; widening it was not
        // asked for and a security control is not the place to generalise for elegance.
        //
        // The container branch requires at least two labels before the suffix, so a bare
        // `azurecontainerapps.io` or a single-label host is refused. Both branches are
        // fully anchored (^...$), which is what stops `https://evil.com/.azurestaticapps.net`
        // and `https://x.azurecontainerapps.io.evil.com` -- neither `/` nor a trailing
        // label is in the allowed character class.
        //
        // Custom domains: add an explicit branch per domain here. Never a wildcard.
        // ALLOWLIST-REGEX -- test/origin-allowlist.test.mjs extracts the next line verbatim
        var ALLOWED_ORIGIN = /^https:\/\/(?:[a-z0-9-]+\.\d+\.azurestaticapps\.net|[a-z0-9-]+(?:\.[a-z0-9-]+)+\.azurecontainerapps\.io)$/i;
        if (!ALLOWED_ORIGIN.test(state.o)) {
          return fail("Origin not allowed: " + state.o);
        }

        var dest = new URL(state.o + "/");
        if (code) dest.searchParams.set("code", code);
        if (error) dest.searchParams.set("error", error);
        dest.searchParams.set("state", stateRaw);
        window.location.replace(dest.toString());
      })();
    </script>
  </body>
</html>
